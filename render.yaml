services:
  # Backend (Node + Express). Plan gratuito de Render: se "duerme" tras 15 min sin tráfico.
  - type: web
    name: gymroutines-api
    runtime: node
    plan: free
    buildCommand: npm install --workspace=backend
    startCommand: npm start --workspace=backend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 8h
      # Los siguientes valores se cargan a mano en el panel de Render (sync: false = no se versionan)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
